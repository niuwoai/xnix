# xdg-desktop-portal backend selection for the Xnix Plasma session.
# The KDE portal backend services file dialogs, screenshots, and
# notifications; the Xnix Compatibility Runtime consumes these portals
# rather than talking to the desktop shell directly.
[preferred]
default=kde
org.freedesktop.impl.portal.Notification=kde
org.freedesktop.impl.portal.FileChooser=kde
