# Xnix greeter policy: boot into the SDDM greeter and offer the
# Plasma (Wayland) session by default. Autologin stays disabled so the
# first boot always presents an authenticated login.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
SessionDir=/usr/share/wayland-sessions

[Autologin]
Session=plasma
Relogin=false
